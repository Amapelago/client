## -*- mode: perl; -*-
# VC-WIN64A compiler settings driven by the unix (GNU make) build template, for building with
# clang-cl on a non-Windows host. perlasm emits GAS syntax, which clang-cl assembles.
my %targets = (
    "VC-WIN64A-gnumake" => {
        inherit_from   => [ "VC-WIN64A" ],
        build_scheme   => [ "unified", "unix" ],
        build_file     => "Makefile",
        perlasm_scheme => "mingw64",
        uplink_arch    => undef,
        # The unix template needs Unix-style platform methods; mingw supplies them with Windows
        # object names. Its static libraries come out as .a and the portfile renames them.
        perl_platform  => "mingw",
    },
);
